controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    twist_controller:
      type: picknik_twist_controller/PicknikTwistController
    # robotiq_gripper_controller removed — thesis_ee has no finger_joint
    fault_controller:
      type: picknik_reset_fault_controller/PicknikResetFaultController
joint_state_broadcaster:
  ros__parameters:
    publish_rate: 50.0
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7
joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_nonzero_velocity_at_trajectory_end: true
    constraints:
      stopped_velocity_tolerance: 0.5
      goal_time: 30.0
      # joint_1/3/5/7 are continuous. The Kortex hardware interface wraps their
      # feedback into [-pi, pi], but a planned trajectory that crosses the seam
      # keeps counting past it, so the JTC's raw desired-minus-actual error
      # reads a full 2*pi (6.2836 rad) even though the arm is tracking exactly.
      # That aborted a calibration sweep on 2026-09-03 (PATH_TOLERANCE_VIOLATED
      # on joint_3). A tolerance of 0.0 disables the check for that joint only;
      # the bounded joints keep theirs. Commanded positions are unaffected --
      # the driver re-wraps them before they reach the arm.
      joint_1: { trajectory: 0.0, goal: 0.0 }
      joint_2: { trajectory: 5.0, goal: 1.0 }
      joint_3: { trajectory: 0.0, goal: 0.0 }
      joint_4: { trajectory: 5.0, goal: 1.0 }
      joint_5: { trajectory: 0.0, goal: 0.0 }
      joint_6: { trajectory: 5.0, goal: 1.0 }
      joint_7: { trajectory: 0.0, goal: 0.0 }
twist_controller:
  ros__parameters:
    joint: tcp
    interface_names:
      - twist.linear.x
      - twist.linear.y
      - twist.linear.z
      - twist.angular.x
      - twist.angular.y
      - twist.angular.z
# robotiq_gripper_controller removed — thesis_ee has no finger_joint
